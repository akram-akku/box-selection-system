<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BoxFit{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f5f7fb;color:#202938}.navbar{background:#172554}
    .hero{background:linear-gradient(120deg,#1d4ed8,#0f766e);color:white;border-radius:18px}
    .card{border:0;box-shadow:0 4px 18px rgba(20,35,70,.07);border-radius:14px}
    .muted{color:#64748b}.btn-primary{background:#1d4ed8}
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4"><div class="container"><a class="navbar-brand fw-bold" href="/">BoxFit</a><a class="btn btn-sm btn-outline-light" href="/admin/">Manage data</a></div></nav>
<main class="container pb-5">{% block content %}{% endblock %}</main>
</body></html>
